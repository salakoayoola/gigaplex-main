services:
#Tautulli
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/tautulli:/config
    ports:
      - 8181:8181
    restart: unless-stopped
    # networks:
    #   - plex-apps
    labels:
            # Watchtower
      - "com.centurylinklabs.watchtower.enable=true"
