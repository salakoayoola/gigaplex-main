settings:
  run_order:
  - operations
  - metadata
  - collections
  - overlays
  cache: true
  cache_expiration: 60
  asset_directory: config/assets
  asset_folders: true
  asset_depth: 0
  create_asset_folders: false
  prioritize_assets: false
  dimensional_asset_rename: false
  download_url_assets: false
  show_missing_season_assets: false
  show_missing_episode_assets: false
  show_asset_not_needed: true
  sync_mode: append
  minimum_items: 1
  default_collection_order:
  delete_below_minimum: true
  delete_not_scheduled: false
  run_again_delay: 2
  missing_only_released: false
  only_filter_missing: false
  show_unmanaged: true
  show_unconfigured: true
  show_filtered: false
  show_options: true
  show_missing: true
  show_missing_assets: true
  save_report: false
  tvdb_language: eng
  ignore_ids:
  ignore_imdb_ids:
  item_refresh_delay: 0
  playlist_sync_to_users: all
  playlist_exclude_users:
  playlist_report: false
  verify_ssl: true
  custom_repo:
  overlay_artwork_filetype: jpg
  overlay_artwork_quality: 75
  show_unfiltered: false
webhooks:                            # Can be individually specified per library as well
  error:
  version:
  run_start:
  run_end:
  changes:
  delete:

plex:                                # Can be individually specified per library as well; REQUIRED for the script to run
  url: http://localhost:32400
  token: # Get your token from Plex Web UI: Settings > Remote Access > Copy Server Access Token
  timeout: 60
  db_cache:
  clean_bundles: false
  empty_trash: false
  optimize: false
  verify_ssl:
tmdb:                                # REQUIRED for the script to run. Get API key from: https://www.themoviedb.org/settings/api
  apikey:
  language: en
  cache_expiration: 60
  region:
tautulli:                            # Get API token from Tautulli Settings > Web Interface > API
  url: http://localhost:8181
  apikey:
github:                              # Get token from: https://github.com/settings/tokens
  token:
omdb:                                # Get API key from: http://www.omdbapi.com/apikey.aspx
  apikey:
  cache_expiration: 60
mdblist:                             # Get API key from: https://mdblist.com/login
  apikey:
  cache_expiration: 60
notifiarr:                           # Get API key from: https://notifiarr.com
  apikey:
gotify:                              # Push notification service (optional)
  url: http://192.168.1.12:80
  token:
anidb:                               # Not required for AniDB builders unless you want mature content
  username:
  password:
  language: en
  client:
radarr:                              # Can be individually specified per library as well. Get token from Radarr Settings > General > Security
  url: http://localhost:7878
  token:
  add_missing: false
  add_existing: false
  upgrade_existing: false
  monitor_existing: false
  root_folder_path: /movies
  monitor: true
  availability: announced
  quality_profile: HD-1080p
  tag:
  search: false
  radarr_path:
  plex_path:
  ignore_cache: false
sonarr:                              # Can be individually specified per library as well. Get token from Sonarr Settings > General > Security
  url: http://localhost:8989
  token:
  add_missing: false
  add_existing: false
  upgrade_existing: false
  monitor_existing: false
  root_folder_path: /tv
  monitor: all
  quality_profile: HD-1080p
  language_profile: English
  series_type: standard
  season_folder: true
  tag:
  search: false
  cutoff_search: false
  sonarr_path:
  plex_path:
  ignore_cache: false
trakt:                               # Get credentials from: https://trakt.tv/oauth/applications
  client_id:
  client_secret:
  pin:
  authorization:
    # everything below is autofilled by the script
    access_token:
    token_type:
    expires_in:
    refresh_token:
    scope: public
    created_at:
mal:                                 # Get credentials from: https://myanimelist.net/apiconfig
  client_id:
  client_secret:
  authorization:
    # everything below is autofilled by the script
    access_token:
    token_type:
    expires_in:
    refresh_token:
