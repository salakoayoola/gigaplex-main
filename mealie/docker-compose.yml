services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest # 
    container_name: mealie
    restart: always
    # ports:
    #     - "9925:9000" # 
    deploy:
      resources:
        limits:
          memory: 1000M # 
    volumes:
      - ./config:/app/data/
    networks:
      - frontend
      - backend
    labels:
      - "traefik.enable=true"
      # HTTPS Router
      - "traefik.http.routers.mealie-secure.entrypoints=websecure"
      - "traefik.http.routers.mealie-secure.rule=Host(`ciybabe.${DOMAIN}`)"
      - "traefik.http.routers.mealie-secure.tls=true"
      - "traefik.http.routers.mealie-secure.tls.certresolver=cloudflare"
      #- "traefik.http.routers.mealie-secure.middlewares=authentik-auth@file"
      - "traefik.http.routers.mealie-secure.service=mealie-service"
      # Backend service port
      - "traefik.http.services.mealie-service.loadbalancer.server.port=9000"
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: 1001
      PGID: 1001
      TZ: Europe/London
      BASE_URL: https://ciybabe.${DOMAIN} #
      # Database Settings
      DB_ENGINE: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}

networks:
   frontend:
     external: true
   backend:
     external: true