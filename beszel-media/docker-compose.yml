services:
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: "beszel-media-agent"
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      - /export/scratch-disk:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_KEY}
      TOKEN: ${TOKEN}
      HUB_URL: ${HUB_URL}
      TZ: Europe/London

    labels:
      # Watchtower
      - "com.centurylinklabs.watchtower.enable=true"